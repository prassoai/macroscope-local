name: Attach release checksums

# Integrity manifest for released artifacts (security finding M2).
#
# The binaries and plugin bundle are built and uploaded by the `back` repo's
# "Build and Release Macroscope Local" workflow, which creates the GitHub
# release here using a cross-repo token (NOT this repo's GITHUB_TOKEN). Because
# the creating token is not GITHUB_TOKEN, the resulting `release` event DOES
# trigger this workflow (GitHub suppresses re-triggering only for GITHUB_TOKEN).
#
# This workflow computes a SHA-256 manifest over every published artifact and
# uploads it as `SHA256SUMS`, plus a keyless cosign signature bundle, so that
# install.sh can verify downloads before installing them. Asset uploads below
# use this repo's GITHUB_TOKEN, so they do not recursively trigger this workflow.

on:
  release:
    types: [published, released]

permissions:
  contents: write
  id-token: write # cosign keyless signing via OIDC

jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Fetch the binaries and the plugin bundle; the manifest/signature we
          # are about to (re)create do not match this glob, so re-runs are clean.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'macroscope-*' --dir dist
          ls -lh dist

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          count=$(find . -maxdepth 1 -type f -name 'macroscope-*' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "No macroscope-* artifacts found on the release; nothing to checksum." >&2
            exit 1
          fi
          # Deterministic ordering keeps the manifest stable across re-runs.
          find . -maxdepth 1 -type f -name 'macroscope-*' -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs sha256sum > SHA256SUMS
          echo "Generated manifest:"
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign SHA256SUMS (keyless)
        working-directory: dist
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle SHA256SUMS.cosign.bundle \
            SHA256SUMS

      - name: Upload manifest and signature to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            dist/SHA256SUMS dist/SHA256SUMS.cosign.bundle \
            --repo "$GITHUB_REPOSITORY" --clobber
